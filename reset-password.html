<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>تغيير كلمة المرور | رفيق المعلم</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f7fc;color:#253650;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,460px);background:#fff;border:1px solid #e7ebf3;border-radius:20px;padding:26px;box-shadow:0 12px 32px #263a5a12}h1{font-size:22px;color:#172b4d;margin:0 0 12px}p{font-size:14px;line-height:1.9;color:#68788e}.field{display:block;margin:16px 0 6px;font-size:13px;font-weight:bold}input{width:100%;padding:13px;border:1px solid #dce3ee;border-radius:10px;font:inherit}button,.link{display:block;width:100%;padding:13px;margin-top:16px;border:0;border-radius:10px;background:#13a89e;color:#fff;text-align:center;text-decoration:none;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#msg{font-size:13px;line-height:1.9;margin-top:14px;white-space:pre-wrap}.ok{color:#18734e}.err{color:#b13c50}.hidden{display:none}
</style>
</head>
<body>
<main class="card">
<h1>تعيين كلمة مرور جديدة</h1>
<p>هذه صفحة مستقلة لاستعادة حساب رفيق المعلم. أدخل كلمة مرور جديدة لا تقل عن 8 أحرف.</p>
<div id="form" class="hidden">
<label class="field" for="pw">كلمة المرور الجديدة</label>
<input id="pw" type="password" autocomplete="new-password" minlength="8">
<label class="field" for="pw2">تأكيد كلمة المرور</label>
<input id="pw2" type="password" autocomplete="new-password" minlength="8">
<button id="save">حفظ كلمة المرور الجديدة</button>
</div>
<div id="msg">جارٍ التحقق من رابط الاستعادة…</div>
<a id="back" class="link hidden" href="https://abobtol66-wq.github.io/rafiq-almoalem/index_sync_fixed.html">العودة إلى رفيق المعلم</a>
</main>
<script>
(async()=>{
 const msg=document.getElementById('msg'),form=document.getElementById('form'),save=document.getElementById('save'),back=document.getElementById('back');
 const say=(s,ok=false)=>{msg.textContent=s;msg.className=ok?'ok':'err'};
 const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
 const getParam=k=>params.get(k)||hash.get(k);
 const authError=getParam('error_code')||getParam('error');
 const description=(getParam('error_description')||'').replace(/\+/g,' ');
 // Expired/used links can be diagnosed without loading the Supabase SDK or local configuration.
 if(authError){
   if(authError==='otp_expired'||/email link is invalid|expired/i.test(description)){
     say('رابط استعادة كلمة المرور منتهي الصلاحية أو سبق استخدامه. لا يمكن إصلاح هذا الرابط. اطلب رسالة استعادة جديدة، ثم افتح أحدث رسالة مرة واحدة فقط في هذا المتصفح.');
   }else{
     say('تعذر قبول رابط الاستعادة: '+(description||authError)+'. اطلب رابطًا جديدًا.');
   }
   back.classList.remove('hidden');return;
 }
 let client,validSession=false,recoveryEvent=false;
 try{
   const cfg=JSON.parse(localStorage.getItem('rafiq_cloud_config_v1')||'{}');
   if(!cfg.url||!cfg.key)throw new Error('إعدادات الاتصال غير موجودة في هذا المتصفح. افتح صفحة رفيق المعلم نفسها واحفظ إعدادات الاتصال أولًا.');
   let sdk=window.supabase;
   if(!sdk?.createClient){
     for(const src of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2']){
       try{await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('تعذر تحميل المكتبة من '+src));document.head.appendChild(s)});if(window.supabase?.createClient){sdk=window.supabase;break}}catch(e){}
     }
   }
   if(!sdk?.createClient)throw new Error('تعذر تحميل مكتبة الاتصال من المصدرين. تحقق من اتصال الإنترنت ثم حدّث الصفحة.');
   client=sdk.createClient(cfg.url,cfg.key,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
   const {data:{subscription}}=client.auth.onAuthStateChange((event,session)=>{
     if(event==='PASSWORD_RECOVERY'){recoveryEvent=true;validSession=!!session;form.classList.remove('hidden');say('تم التحقق من رابط الاستعادة. أدخل كلمة المرور الجديدة.',true);}
     else if(session&&recoveryEvent)validSession=true;
   });
   const {data,error}=await client.auth.getSession();
   if(error)throw error;
   if(data.session){validSession=true;form.classList.remove('hidden');say('تم العثور على جلسة صالحة. أدخل كلمة المرور الجديدة.',true);}
   else if(!recoveryEvent){
     if(getParam('code'))throw new Error('وصل رمز الاستعادة لكن لم تتكون جلسة صالحة. قد يكون الرمز منتهيًا أو استُخدم في متصفح آخر. اطلب رابطًا جديدًا وافتحه في هذا المتصفح.');
     throw new Error('لم تصل جلسة استعادة صالحة. اطلب رابطًا جديدًا وافتحه في المتصفح نفسه.');
   }
   save.addEventListener('click',async()=>{
     try{
       const a=document.getElementById('pw').value,b=document.getElementById('pw2').value;
       if(!validSession)throw new Error('جلسة الاستعادة غير صالحة. اطلب رابطًا جديدًا.');
       if(a.length<8)throw new Error('اجعل كلمة المرور 8 أحرف على الأقل.');
       if(a!==b)throw new Error('كلمتا المرور غير متطابقتين.');
       save.disabled=true;save.textContent='جارٍ الحفظ…';
       const {error}=await client.auth.updateUser({password:a});
       if(error)throw error;
       say('تم تغيير كلمة المرور بنجاح. يمكنك العودة إلى رفيق المعلم وتسجيل الدخول بكلمة المرور الجديدة.',true);
       history.replaceState(null,'',location.pathname);form.classList.add('hidden');back.classList.remove('hidden');
     }catch(e){say(e.message||String(e));save.disabled=false;save.textContent='حفظ كلمة المرور الجديدة';}
   });
 }catch(e){say(e.message||String(e));back.classList.remove('hidden');}
})();
</script>
</body>
</html>
